name: Build Standalone App

permissions:
  contents: write  # required for creating releases/tags

on:
  push:
    branches: [ main, beta ]
  pull_request:
    branches: [ main, beta ]
  workflow_dispatch:

jobs:
  build-standalone:
    name: Build Standalone App (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ensure full history and tags for tag collision checks

      - name: Fetch tags
        run: git fetch --tags --force --prune

      - name: Build menubar app
        run: bash build-standalone-app-native.sh

      - name: Smoke test (headless)
        run: HB_CI_SMOKE=1 build/App/Homebridge.app/Contents/MacOS/Homebridge

      - name: Import signing certificate (main only)
        if: github.ref == 'refs/heads/main'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euxo pipefail
          if [ -z "${CERTIFICATE_P12:-}" ]; then
            echo "No signing cert provided; skipping codesign on main."; exit 0
          fi
          echo "$CERTIFICATE_P12" | base64 --decode > cert.p12
          security create-keychain -p actions temp.keychain
          security default-keychain -s temp.keychain
          security unlock-keychain -p actions temp.keychain
          security import cert.p12 -k temp.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign || true
          security set-key-partition-list -S apple-tool:,apple: -s -k actions temp.keychain
          rm cert.p12

      - name: Codesign app and node (main only)
        if: github.ref == 'refs/heads/main'
        env:
          SIGN_ID: ${{ secrets.APPLE_SIGN_ID }}
        run: |
          set -euxo pipefail
          APP="build/App/Homebridge.app"
          NODE_BIN="$APP/Contents/Frameworks/node/bin/node"
          ENT="scripts/macos/entitlements.plist"
          if [ -n "${SIGN_ID:-}" ]; then
            # Ensure executable bit
            chmod +x "$NODE_BIN" || true
            # Sign node first, then the app bundle
            codesign --force --options runtime --timestamp --entitlements "$ENT" --sign "$SIGN_ID" "$NODE_BIN"
            codesign --force --deep --options runtime --timestamp --entitlements "$ENT" --sign "$SIGN_ID" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
          else
            echo "No SIGN_ID provided; skipping codesign on main."
          fi

      - name: Create DMG
        shell: bash
        run: |
          set -euxo pipefail
          APP="build/App/Homebridge.app"
          test -d "$APP"  # ensure app exists
          mkdir -p build/dmg
          ln -s /Applications build/dmg/Applications || true
          cp -R "$APP" build/dmg/
          VERSION="${GITHUB_REF_NAME:-dev}"
          hdiutil create -volname "Homebridge" -srcfolder build/dmg -format UDZO -imagekey zlib-level=9 "build/homebridge-${VERSION}.dmg"

      - name: Sign DMG (main only)
        if: github.ref == 'refs/heads/main'
        env:
          SIGN_ID: ${{ secrets.APPLE_SIGN_ID }}
        run: |
          set -euo pipefail
          if [ -n "${SIGN_ID:-}" ]; then
            codesign --force --sign "$SIGN_ID" build/homebridge-*.dmg
          else
            echo "No SIGN_ID; skipping DMG signing."
          fi

      - name: Notarize DMG (main only)
        if: github.ref == 'refs/heads/main'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            xcrun notarytool submit build/homebridge-*.dmg \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
          else
            echo "No notary credentials; skipping notarization."
          fi

      - name: Staple notarization (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          xcrun stapler staple build/homebridge-*.dmg || echo "Staple skipped or not required."

      - name: List outputs
        run: ls -lh build/

      - name: Upload DMG artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: homebridge-dmg
          path: build/homebridge-*.dmg
          retention-days: 90
          if-no-files-found: error

      - name: Compute release metadata (date-based tag)
        id: meta
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          # Use UTC date YYYY.MM.DD as base version
          BASE=$(date -u +%Y.%m.%d)
          PREFIX="v${BASE}"
          # Find existing tags for today and determine next available suffix
          EXISTING=$(git tag -l "${PREFIX}*" | tr '\n' ' ')
          NEXT_TAG="$PREFIX"
          if [ -n "${EXISTING}" ]; then
            MAX=0
            for T in ${EXISTING}; do
              S=${T#${PREFIX}}
              if [[ "$S" =~ ^-([0-9]+)$ ]]; then
                N=${BASH_REMATCH[1]}
                if [ "$N" -gt "$MAX" ]; then MAX=$N; fi
              else
                # Bare vYYYY.MM.DD exists; treat as 0
                if [ "$MAX" -lt 0 ]; then MAX=0; fi
              fi
            done
            NEXT=$((MAX+1))
            NEXT_TAG="${PREFIX}-${NEXT}"
          fi
          SHORTSHA=$(git rev-parse --short HEAD)
          echo "tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"
          echo "shortsha=$SHORTSHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (date-based)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Homebridge ${{ steps.meta.outputs.tag }} (${{ github.ref_name }} ${{ steps.meta.outputs.shortsha }})
          files: build/homebridge-*.dmg
          prerelease: ${{ github.ref_name == 'beta' }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
